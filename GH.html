<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GitHub Projects</title>

<link rel="stylesheet" href="/assets/style.css">

<style>

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.repo-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:20px;
}

.repo-card{
border:1px solid #ddd;
padding:15px;
border-radius:8px;
background:white;
transition:0.2s;
}

.repo-card:hover{
transform:translateY(-3px);
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.repo-card h2{
font-size:1.2em;
margin:0 0 10px 0;
}

.repo-card a{
text-decoration:none;
color:inherit;
display:block;
}

.repo-card p{
font-size:0.9em;
min-height:40px;
}

.repo-meta{
font-size:0.8em;
color:#666;
margin-top:10px;
}

.orgs{
margin-top:40px;
}

.org-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.org{
padding:6px 10px;
border:1px solid #ccc;
border-radius:6px;
font-size:0.85em;
background:#f5f5f5;
}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container">

<h1>GitHub Projects</h1>

<p>
Overview of projects from
<a href="https://github.com/Ignotum77" target="_blank" rel="noopener noreferrer">
Ignotum77
</a>
</p>

<div id="repos" class="repo-grid"></div>

<div class="orgs">
<h2>Organizations</h2>
<div id="orgs" class="org-list"></div>
</div>

</div>

<script>

/* navbar */
fetch("/navfooter/navbar.html")
.then(r => r.text())
.then(data => {
document.getElementById("navbar").innerHTML = data
})

/* repositories */
fetch("https://api.github.com/users/Ignotum77/repos?sort=updated&per_page=100")
.then(res => res.json())
.then(repos => {

let container=document.getElementById("repos")

repos.forEach(repo=>{

let card=`
<div class="repo-card">

<a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">

<h2>${repo.name}</h2>

<p>${repo.description ?? "No description available"}</p>

<div class="repo-meta">
⭐ ${repo.stargazers_count}  
🍴 ${repo.forks_count}  
💻 ${repo.language ?? "Unknown"}
</div>

</a>

</div>
`

container.innerHTML+=card

})

})

/* organizations */
fetch("https://api.github.com/users/Ignotum77/orgs")
.then(res => res.json())
.then(orgs => {

let container=document.getElementById("orgs")

orgs.forEach(org=>{

let item=`
<a class="org" href="${org.html_url}" target="_blank" rel="noopener noreferrer">
${org.login}
</a>
`

container.innerHTML+=item

})

})

</script>

</body>
</html>
