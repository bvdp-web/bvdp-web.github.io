<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Artikelen in PDF-formaat</title>
    <link rel="icon" type="image/png" href="../0home/images/pasted-image-472.png">
    <meta name="referrer" content="same-origin">
    <link rel="canonical" href="artikelen-in-pdf-formaat.html">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
    <link rel="preload" href="../0home/css/Lato-Bold.woff2" as="font" crossorigin>
    <style>
      :root {
        color-scheme: light;
        --panel-bg: rgba(30, 35, 40, 0.78);
        --panel-border: rgba(255, 255, 255, 0.45);
        --link-color: #fff;
        --link-hover: #dceefa;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--link-color);
        background-color: #fff;
        background-image: url("../0home/images/untitled-1200-27.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      .site-header {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 12px 20px;
        background: rgba(55, 60, 68, 0.72);
        border-bottom: 1px solid var(--panel-border);
      }
      .home-link {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
      }
      .home-link img {
        display: block;
        width: 36px;
        height: 36px;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 2.4vw, 1.65rem);
        line-height: 1.25;
        text-align: center;
      }
      main {
        width: min(100% - 32px, 440px);
        margin: clamp(24px, 8vh, 72px) auto 0;
        padding: 28px 24px;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel-bg);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
      }
      .article-links {
        display: grid;
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .article-links a {
        display: block;
        color: var(--link-color);
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.4;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .article-links a:hover,
      .article-links a:focus-visible {
        color: var(--link-hover);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .article-links a:focus-visible,
      .home-link:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }
      @media (max-width: 480px) {
        .site-header {
          gap: 10px;
          padding: 10px 12px;
        }
        .home-link img {
          width: 30px;
          height: 30px;
        }
        main {
          width: calc(100% - 24px);
          margin-top: 24px;
          padding: 22px 18px;
        }
        .article-links {
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="home-link" href="/" aria-label="Naar de homepage">
        <img src="../0home/images/homew-80.png" alt="">
      </a>
      <h1>Artikelen in PDF-formaat</h1>
    </header>
    <main>
      <nav aria-label="Artikelen">
        <ul class="article-links">
          <li><a href="openbaring.html">Het boek Openbaring</a></li>
          <li><a href="diverse-artikelen.html">Diverse artikelen</a></li>
          <li><a href="fake-palestijnen.html">Fake Palestijnen</a></li>
          <li><a href="klimaathysterie.html">Klimaathysterie</a></li>
          <li><a href="nieuwsbrieven.html">Nieuwsbrieven</a></li>
          <li><a href="interview-met-franklin.html">Interview met Franklin</a></li>
          <li><a href="bijbelse-onderwerpen.html">Bijbelse onderwerpen</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
